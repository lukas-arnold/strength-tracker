<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strength Tracker</title>
  <link rel="stylesheet" href="/web/css/pico.min.css">
  <link rel="stylesheet" href="/web/assets/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="/web/assets/fontawesome/css/solid.min.css">
</head>

<body>

<div role="group">
   <a href="/">
    <button class="outline primary"><i class="fa-solid fa-arrow-left"></i></button>
  </a>
  <h1>Editing {{.Id}}</h1>
</div>

<form action="/exercise/save/{{.Id}}" method="POST">
  <div><input name="muscleGroup" value="{{.MuscleGroup}}"></div>
  <div><input name="name" value="{{.Name}}"></div>
  <div><input type="submit" value="Save"></div>
</form>

</body>

</html>
