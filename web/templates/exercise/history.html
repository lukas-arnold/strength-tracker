<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strength Tracker</title>
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/format.js" defer></script>
</head>

<body>

<h1>History of {{.Name}} ({{.MuscleGroup}})</h1>

<div>
  <canvas id="historyChart"></canvas>
</div>

<table>
    <tr>
        <th>Date</th>
        <th>Load</th>
    </tr>
    <tr>
        {{range .StrengthHistory}}
            <tr>
                <td class="date">{{.Date}}</td>
                <td class="load">{{.Load}}</td>
                <td>
                    <form action="/strength/edit/{{.Id}}">
                        <button type="submit" class="secondary"><i class="fa-solid fa-pen"></i></button>
                    </form>
                    <form action="/strength/delete/{{.Id}}">
                        <button type="submit" class="contrast"><i class="fa-solid fa-trash"></i></button>
                    </form>
                </td>
            </tr>
        {{end}}
    </tr>
</table>

</body>

<script>
  function formatDate(date) {
    date = new Date(date);
    const options = {year: "numeric", month: "2-digit", day: "2-digit"};
    date = date.toLocaleDateString("default", options);
    return date;
  }
</script>

<script>
  const ctx = document.getElementById('historyChart');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: {{.Dates}},
      datasets: [{
        label: "Load",
        data: {{.Loads}},
        borderWidth: 1
      }]
    },
    options: {
      plugins: {
        tooltip: {
          callbacks: {
            title: (tooltipItem, data) => {
              return formatDate(tooltipItem[0].label)
            },
            label: (tooltipItem, data) => {
                return tooltipItem.formattedValue.replace(".", ",") + " kg";
            }
          }
        }
      },
      scales: {
        y: {
          beginAtZero: false,
          ticks: {
            callback: (value) => {
              return value + " kg"
            }
          }
        },
        x: {
          ticks: {
            callback: function(value) {
              return formatDate(this.getLabelForValue(value));
            }
          }
        },
      }
    }
  });
</script>

</html>
