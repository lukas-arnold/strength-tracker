{{define "template"}}
<div class="center">
  <h1>{{T "addStrength"}}</h1>
</div>
<div class="center">
  <h2>{{.Name}} ({{.MuscleGroup}})</h2>
</div>
<form action="/strength/add/{{.Id}}" method="POST">
  <div><input name="date" type="date" id="date"></div>
  <div><input name="load" type="number" step="0.01" placeholder='{{T "load"}}'></div>
  <div><input type="submit" value='{{T "save"}}'></div>
</form>
{{end}}
