{{define "template"}}
<div class="center">
  <h1>{{T "editStrength"}}</h1>
</div>
<form action="/strength/save/{{.Id}}" method="POST">
  <div><input name="date" value="{{.Date}}" type="date"></div>
  <div><input name="load" value="{{.Load}}" type="number" step="0.1"></div>
  <div><input type="submit" value='{{T "save"}}'></div>
</form>
{{end}}
