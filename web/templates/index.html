<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strength Tracker</title>
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
>
</head>

<body>
  
  <table>
    <tr>
      <th>Muscle Group</th>
      <th>Exercise</th>
      <th>Last load</th>
      <th>Strength History</th>
    </tr>
    <tr>
      {{range .}}
      <tr>
        <td>{{.MuscleGroup}}</td>
        <td>{{.Name}}</td>
        <td>
          <div>{{.LastStrength.Load}}</div>
          <div>{{.LastStrength.Date}}</div>
          <form action="/exercise/history/{{.Id}}">
            <input type="submit" value="Full History" />
          </form>
        </td>
        <td>
          <form action="/strength/add/{{.Id}}">
              <input type="submit" value="Add strength" />
          </form>
          <form action="/exercise/edit/{{.Id}}">
              <input type="submit" value="Edit" />
          </form>
          <form action="/exercise/delete/{{.Id}}">
              <input type="submit" value="Delete" />
          </form>
        </td>
      </tr>
      {{end}}
    </tr>
  </table>

  <form action="/exercise/add">
    <input type="submit" value="Add exercise" />
  </form>

</body>

</html>
